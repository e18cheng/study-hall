<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Hall">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="A study hall for trivia: memorize world geography, US presidents, and more. Works offline once installed.">
<title>Study Hall</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f5f4ef; --panel: #ffffff; --text: #1f2328; --muted: #6a6f76; --border: #e4e2db; --chip: #f0efe9;
  --sea: #d6e4ed; --land-off: #ebe8e1; --land: #c3cbbb; --stroke: #ffffff; --halo: rgba(255,255,255,.85);
  --accent: #2f6fde; --accent-ink: #ffffff;
  --good: #2e9d5b; --ok: #d8b02c; --meh: #e07a30; --bad: #d64242;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --panel: #1a1b1e; --text: #e8e8e6; --muted: #9a9ca1; --border: #2c2d31; --chip: #24262a;
    --sea: #142029; --land-off: #26272b; --land: #4a5247; --stroke: #121315; --halo: rgba(18,19,21,.85);
    --accent: #5b8ff0; --accent-ink: #0b1020;
    --good: #3fb26c; --ok: #d9b43c; --meh: #e58a45; --bad: #e05555;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --panel: #1a1b1e; --text: #e8e8e6; --muted: #9a9ca1; --border: #2c2d31; --chip: #24262a;
  --sea: #142029; --land-off: #26272b; --land: #4a5247; --stroke: #121315; --halo: rgba(18,19,21,.85);
  --accent: #5b8ff0; --accent-ink: #0b1020;
  --good: #3fb26c; --ok: #d9b43c; --meh: #e58a45; --bad: #e05555;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-columns: 340px 1fr; height: 100vh; height: 100dvh; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }

/* panel */
#panel { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.pscroll { flex: 1; min-height: 0; overflow: auto; }
.ptitle { padding: 16px 16px 0; }
.ptitle + .pbody { padding-top: 0; }
.pbody { padding: 16px; }
.pfoot { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 8px; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
h2 { font-size: 17px; margin: 4px 0 2px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 6px; }
.chip { border: 1px solid var(--border); background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.btn { border: 1px solid var(--border); background: var(--chip); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns .wide, .btns .full { grid-column: 1 / -1; }
.qrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qrow .tally { margin: 0; }
.back { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.back:hover { color: var(--text); }

.cont { margin-top: 12px; }
.cont-h { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 4px 0; border-bottom: 1px solid var(--border); }
.cont-h .n { margin-left: auto; }
.n { color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.reg { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 4px; }
.reg label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; padding: 3px 0; }
.reg .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.best { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.learn { border: 1px dashed var(--border); background: none; border-radius: 999px; font-size: 11.5px; padding: 1px 8px; color: var(--muted); white-space: nowrap; }
.reg .learn { padding: 1px 6px; }
.pfoot .tog { margin: 0; }
.learn.on { border-style: solid; border-color: var(--good); color: var(--good); font-weight: 600; }
input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex: none; }
.tog { display: flex; gap: 8px; align-items: center; margin: 8px 0; cursor: pointer; }

.clist { list-style: none; padding: 0; margin: 0; columns: 2; column-gap: 8px; }
.clist li { break-inside: avoid; }
.clist button { border: 0; background: none; padding: 3px 4px; border-radius: 6px; text-align: left; width: 100%; display: flex; align-items: center; gap: 7px; }
.clist button:hover { background: var(--chip); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; border: 1.5px solid var(--border); }
.dot.r1 { background: var(--good); border-color: var(--good); }
.dot.r2 { background: var(--ok); border-color: var(--ok); }
.dot.r3 { background: var(--meh); border-color: var(--meh); }
.dot.rx { background: var(--bad); border-color: var(--bad); }

/* quiz */
.qbar { display: flex; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.qbar .back { margin: 0; }
.qbar #qtime, .qbar #ltime { margin-left: auto; }
.prompt { font-size: 22px; line-height: 1.25; margin: 14px 0 10px; font-weight: 500; }
.prompt b { font-weight: 750; }
.qform { display: flex; gap: 8px; }
.qform input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); outline: none; }
.qform input:focus { border-color: var(--accent); }
/* iOS offers contact AutoFill on text fields it mistakes for name/address fields. A neutral
   name and placeholder keep the bar away; this hides the in-field AutoFill button too. */
input[autocomplete="off"]::-webkit-contacts-auto-fill-button,
input[autocomplete="off"]::-webkit-credentials-auto-fill-button {
  visibility: hidden; display: none !important; pointer-events: none;
  height: 0; width: 0; margin: 0;
}
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.fb { min-height: 22px; margin: 10px 0; font-weight: 600; }
.fb.good { color: var(--good); } .fb.bad { color: var(--bad); } .fb.info { color: var(--muted); font-weight: 500; }
.tally { display: flex; gap: 14px; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
.tally span { display: inline-flex; align-items: center; gap: 5px; }
.bar { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.score { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1; margin: 8px 0 6px; }
.newbest { display: inline-block; background: var(--good); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 9px; font-weight: 700; vertical-align: middle; margin-left: 6px; }

/* map */
#mapwrap { position: relative; min-height: 0; min-width: 0; }
#map { width: 100%; height: 100%; display: block; background: var(--sea); touch-action: none; user-select: none; -webkit-user-select: none; }
.c { fill: var(--land-off); stroke: var(--stroke); stroke-width: .6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.c.click, .mk.click { cursor: pointer; }
.c.hov, .mk.hov { stroke: var(--text); stroke-width: 1.6; }
.mk { stroke: var(--stroke); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.lb { fill: var(--text); stroke: var(--halo); paint-order: stroke; stroke-linejoin: round; font-weight: 600; pointer-events: none; dominant-baseline: central; }
.flash { animation: flash .75s; }
@keyframes flash { 30%, 70% { fill: var(--bad); } }
.flash-good { animation: flashgood .75s; }
@keyframes flashgood { 20%, 60% { fill: var(--good); } }
.hardtag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--bad); border: 1px solid var(--bad); border-radius: 4px; padding: 0 5px; vertical-align: middle; }
.learn.terr.on { border-color: var(--accent); color: var(--accent); }
.ring { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; animation: pulse 1.2s ease-out infinite; pointer-events: none; }
.ring.bad { stroke: var(--bad); }
@keyframes pulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(2.3); opacity: 0; } }
#tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); display: none; white-space: nowrap; z-index: 2; }
#tip .sub { color: var(--muted); font-size: 11.5px; }
.zoomctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoomctl button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); font-size: 17px; line-height: 1; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

/* app switcher: overlay drawer, closed by default so it costs no layout width */
/* 9px left padding: the 30px hit area is wider than the 16px icon, so this lines the
   visible bars up with the 16px content edge below. */
.phead { display: flex; align-items: center; gap: 2px; flex: none; padding: 6px 12px 6px 9px; border-bottom: 1px solid var(--border); }
.phead .app { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.navbtn { width: 30px; height: 30px; padding: 0; border: 0; background: none; border-radius: 8px;
  color: var(--muted); display: grid; place-items: center; }
/* Drawn rather than the ☰ character: glyph side bearings differ between browsers and left
   the icon a couple of pixels off-centre. */
.navbtn .navicon { display: block; width: 16px; height: 12px; fill: currentColor; }
.navbtn:hover { background: var(--chip); color: var(--text); }
.navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* update notice: shown only when a new service worker is waiting */
#updateBanner { position: fixed; z-index: 60; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px);
  background: var(--text); color: var(--panel); border-radius: 999px; padding: 7px 8px 7px 14px;
  font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
#updateBanner[hidden] { display: none; }
#updateBanner button { border: 0; background: var(--accent); color: var(--accent-ink);
  border-radius: 999px; padding: 5px 12px; font-weight: 700; }

#navScrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .32); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
body.nav-open #navScrim { opacity: 1; pointer-events: auto; }
#nav { position: fixed; inset: 0 auto 0 0; width: 240px; max-width: 84vw; z-index: 41; background: var(--panel);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; padding: 12px 10px;
  padding-top: max(12px, env(safe-area-inset-top)); overflow: auto;
  transform: translateX(-102%); visibility: hidden; transition: transform .2s ease, visibility 0s linear .2s; }
body.nav-open #nav { transform: none; visibility: visible; transition: transform .2s ease; }
.navhead { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px; }
.navhead span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#navClose { width: 28px; height: 28px; padding: 0; border: 0; background: none; border-radius: 8px; color: var(--muted);
  font-size: 14px; line-height: 1; display: grid; place-items: center; }
#navClose:hover { background: var(--chip); color: var(--text); }
#nav button[data-app] { width: 100%; border: 0; background: none; border-radius: 10px; color: var(--text); text-align: left;
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 19px; line-height: 1; }
#nav button[data-app]:hover { background: var(--chip); }
#nav button[data-app].on { background: var(--chip); box-shadow: inset 0 0 0 1px var(--border); }
#nav button[data-app] .lbl { font-size: 13px; font-weight: 600; letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { #nav, #navScrim { transition: none; } }
body[data-module="list"] #mapwrap { display: none; }
/* List quizzes reuse the world layout: controls and status in the left panel, the answer
   list in the main area where the map sits for countries. */
#listmain { display: none; min-width: 0; min-height: 0; overflow: auto; background: var(--bg); }
body[data-module="list"] #listmain { display: block; }
.lmain { max-width: 980px; margin: 0 auto; padding: 24px 28px 48px; }
.lmain h3:first-child { margin-top: 0; }
.llegend { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.llegend li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }

/* list rows */
/* Multi-column, not grid: rows read top-down the first column, then the next. */
.lrows { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 18px; }
.lrows > li { break-inside: avoid; }
@media (max-width: 720px) { .lrows { columns: 1; } }
.lrow { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 6px; min-height: 27px; }
.lrow .ln { width: 20px; text-align: right; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
.lrow .lname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .lmeta { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lrow .lline { flex: 1; border-bottom: 1px dashed var(--border); height: .9em; opacity: .55; }
.lrow.cur { background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
.lrow.cur .ln { color: var(--accent); font-weight: 700; }
.lrow.miss .lname { color: var(--bad); }
.ldot { width: 7px; height: 7px; border-radius: 50%; background: var(--pc, var(--muted)); flex: none; }
.pty-independent { --pc: #8a8f98; } .pty-federalist { --pc: #9b6bd6; }
.pty-democratic-republican { --pc: #2f9e8f; } .pty-democratic { --pc: #2f6fde; }
.pty-whig { --pc: #d8a13a; } .pty-republican { --pc: #d64242; } .pty-national-union { --pc: #e07a30; }
.cat-comedy { --pc: #2f9e8f; } .cat-history { --pc: #d8a13a; }
.cat-tragedy { --pc: #d64242; } .cat-romance { --pc: #9b6bd6; }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .phead { padding: 4px 12px 4px 9px; }
  .phead .app { font-size: 10px; }
  #nav { width: 260px; }
  #panel { border-right: 0; border-bottom: 1px solid var(--border); }
  .pbody { padding: 12px 16px; }
  .prompt { font-size: 19px; margin: 8px 0; }
  /* Outside a quiz the whole page scrolls: map pinned on top, action buttons pinned at the bottom. */
  /* svh, not dvh: dvh changes as Safari's toolbar hides while scrolling, which resized the
     map and shifted everything under the user's finger. */
  body:not(.quizzing) { display: flex; flex-direction: column; height: auto; min-height: 100vh; min-height: 100svh; overflow: visible; background: var(--panel); }
  /* Flatten the panel so its header, title, body and footer can be ordered around the map. */
  body:not(.quizzing) #panel,
  body:not(.quizzing) .pscroll { display: contents; }
  body:not(.quizzing) .phead { order: 1; }
  body:not(.quizzing) .ptitle { order: 2; flex: none; padding: 12px 16px 0; }
  body:not(.quizzing) #mapwrap { order: 3; position: sticky; top: 0; z-index: 3; flex: none; height: 46vh; height: 46svh; border-bottom: 1px solid var(--border); }
  body[data-view="home"] #mapwrap { height: min(40vh, 66vw); height: min(40svh, 66vw); }
  /* Country quiz: size the grid to the visual viewport so the map fits above the
     keyboard and re-projects into the space that is actually visible. */
  body[data-app="countries"].quizzing { height: 100vh; height: var(--app-vh, 100vh); }
  body:not(.quizzing) .pbody { order: 4; flex: 1 0 auto; overflow: visible; }
  body:not(.quizzing) .pfoot { order: 5; position: sticky; bottom: 0; background: var(--panel); padding-bottom: calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 16px rgba(0,0,0,.07); }
  /* Presidents outside the quiz: the panel flattens, so the study list follows the
     sidebar controls and the action buttons stay pinned at the bottom. */
  body[data-module="list"]:not(.quizzing) #listmain { order: 3; overflow: visible; }
  body[data-module="list"]:not(.quizzing) #listmain .lmain { padding: 0 16px 16px; }
  /* Presidents quiz: a fixed shell. The header and the input stay put and the list scrolls
     between them, instead of the whole page scrolling under a floating input. */
  /* --app-vh is kept in sync with the visual viewport: Safari shrinks that for the keyboard
     but leaves the layout viewport (and 100dvh) alone, then pans the page to reveal the
     focused input, which dragged the whole shell up. */
  body[data-module="list"][data-lview="quiz"] { display: flex; flex-direction: column; height: 100vh; height: var(--app-vh, 100vh); min-height: 0; overflow: hidden; background: var(--panel); }
  /* Flatten the panel so the prompt, the scrolling list and the input can stack in that
     order; the list itself lives in #listmain. */
  body[data-module="list"][data-lview="quiz"] #panel { display: contents; }
  body[data-module="list"][data-lview="quiz"] .phead { order: 0; }
  /* Undo the non-quiz `display: contents` so the prompt block keeps its own box and order. */
  body[data-module="list"][data-lview="quiz"] .pscroll { order: 1; display: flex; flex-direction: column; flex: none; overflow: visible; }
  body[data-module="list"][data-lview="quiz"] .pbody { flex: none; overflow: visible; display: block; }
  body[data-module="list"][data-lview="quiz"] #listmain { order: 2; display: block; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); }
  body[data-module="list"][data-lview="quiz"] #listmain .lmain { padding: 0 16px; }
  body[data-module="list"][data-lview="quiz"] #llist { columns: 1; }
  body[data-module="list"][data-lview="quiz"] .pfoot { order: 3; position: static; flex: none; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .btns { display: flex; flex-wrap: wrap; }
  .btns > * { flex: 1 1 0; min-width: 28%; padding: 10px 8px; }
  .btns > .full { flex-basis: 100%; }
  .hide-sm { display: none; }
  .reg { padding: 3px 0 3px 2px; }
  .reg label { padding: 7px 0; }
  .learn { padding: 4px 9px; }
  .cont-h { padding: 8px 0 6px; }
  .clist button { padding: 7px 4px; }
  .qform input { font-size: 16px; } /* below 16px iOS Safari zooms the page on focus */
  .zoomctl { right: 8px; bottom: 8px; flex-direction: row; }
  .zoomctl button { width: 30px; height: 30px; font-size: 15px; }
}
</style>
</head>
<body data-app="countries" data-module="map">
<div id="updateBanner" hidden>
  <span>A new version is available.</span>
  <button type="button" id="updateReload">Reload</button>
</div>
<div id="navScrim"></div>
<nav id="nav" aria-label="Study topics">
  <div class="navhead"><span>Study Hall</span><button id="navClose" aria-label="Close menu">✕</button></div>
  <button data-app="countries" class="on" aria-label="World Geography">
    <span aria-hidden="true">🌍</span><span class="lbl">World</span>
  </button>
  <button data-app="presidents" aria-label="US Presidents">
    <span aria-hidden="true">🏛️</span><span class="lbl">Presidents</span>
  </button>
  <button data-app="shakespeare" aria-label="Shakespeare">
    <span aria-hidden="true">🎭</span><span class="lbl">Shakespeare</span>
  </button>
</nav>
<aside id="panel"></aside>
<main id="listmain"></main>
<div id="mapwrap" role="main">
  <svg id="map"></svg>
  <div id="tip"></div>
  <div class="zoomctl">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zreset" title="Reset view">⟲</button>
  </div>
  <div id="loading">Loading map…</div>
</div>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="map-data.js"></script>
<script>
// ---------------------------------------------------------------------------
// Regions. Edit freely: "code Name|alias|alias; ..." (code = ISO 3166 numeric,
// as used by world-atlas). Aliases are extra accepted answers in typing mode.
// ---------------------------------------------------------------------------
const REGION_DEFS = [
  ['Americas', [
    ['na', 'North America', '124 Canada; 840 United States|usa|us|america|united states of america; 484 Mexico'],

// Overseas parts that Natural Earth draws as part of the parent country:
// [parent, new code, test on the polygon's centroid (lon, lat)].
const SPLITS = [
  ['250', 'GF', (x, y) => x > -56 && x < -50 && y > 1 && y < 7],
  ['250', 'GP', (x, y) => x > -62 && x < -60.9 && y > 15.8 && y < 16.6],

const EXTRA_NAMES = { '260': 'French Southern & Antarctic Lands', '334': 'Heard & McDonald Islands', 'x-Siachen Glacier': 'Siachen Glacier (disputed)' };

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/&/g, ' and ').replace(/\bst\.?\s+/g, 'saint ')
  .replace(/\b(the|and|of)\b/g, '').replace(/[^a-z0-9]/g, '');

const CONTINENTS = [], REGIONS = {}, COUNTRY = {};
let regionIdx = 0;
function addItems(r, list, into) {
  for (const item of list.split(';').map(s => s.trim()).filter(Boolean)) {
    const sp = item.indexOf(' ');
    const code = item.slice(0, sp);
    const [names, terr] = item.slice(sp + 1).split('^');
    const [nm, ...aliases] = names.split('|');
    COUNTRY[code] = { code, name: nm, region: r.id, idx: r.codes.length + r.terr.length, terr, forms: [nm, ...aliases].map(norm) };
    into.push(code);
  }
}
for (const [cont, regs] of REGION_DEFS) {
  const c = { name: cont, regions: [] };
  for (const [id, name, list] of regs) {
    const r = { id, name, cont, codes: [], terr: [], hue: (regionIdx++ * 137.5 + 20) % 360 };
    addItems(r, list, r.codes);
    addItems(r, TERR_DEFS[id] || '', r.terr);
    REGIONS[id] = r; c.regions.push(r);
  }
  CONTINENTS.push(c);
}

function regionColor(rid, i = 0) {

// Map setup

function init() {
  const topo = window.COUNTRIES_TOPO;
  if (!topo || !window.d3 || !window.topojson) { $('#loading').textContent = 'Could not load the map — check your internet connection and that map-data.js is next to this page.'; return; }

  const groups = new Map();
  for (const g of topo.objects.countries.geometries) {
    const nm = g.properties.name;
    if (nm === 'Antarctica') continue;
    const code = NAME_TO_CODE[nm] || g.id || ('x-' + nm);
    if (!groups.has(code)) groups.set(code, []);
    groups.get(code).push(g);
  }
  const shapes = new Map();
  for (const [code, gs] of groups) {
    const geometry = gs.length === 1 ? topojson.feature(topo, gs[0]).geometry : topojson.merge(topo, gs);
    const own = gs.find(g => g.id === code) || gs[0];
    shapes.set(code, { geometry, neName: own.properties.name });
  }
  for (const [from, to, test] of SPLITS) {
    const src = shapes.get(from);
    if (!src || src.geometry.type !== 'MultiPolygon') continue;
    const take = [], keep = [];
    for (const p of src.geometry.coordinates) {
      const [x, y] = d3.geoCentroid({ type: 'Polygon', coordinates: p });
      (test(x, y) ? take : keep).push(p);
    }
    if (!take.length) continue;
    src.geometry = { type: 'MultiPolygon', coordinates: keep };
    if (shapes.has(to)) shapes.get(to).geometry.coordinates.push(...take);
    else shapes.set(to, { geometry: { type: 'MultiPolygon', coordinates: take }, neName: COUNTRY[to]?.name || to });
  }
  for (const [code, s] of shapes) FEATS.set(code, makeFeat(code, { type: 'Feature', geometry: s.geometry }, s.neName));

  for (const f of FEATS.values()) {
    if (f.geo.geometry.type !== 'Point') f.el = gC.append('path').attr('class', 'c').attr('data-code', f.code).node();
  }
  for (const code of Object.keys(COUNTRY)) {
    const f = FEATS.get(code);
    if (!f) { console.warn('missing map shape for', code, COUNTRY[code].name); continue; }
    f.country = COUNTRY[code];
    f.mk = gM.append('circle').attr('class', 'mk').attr('data-code', code).node();
    f.lb = gL.append('text').attr('class', 'lb').text(f.country.name).node();
    SOV.push(f);
  }
  $('#loading').remove();
  setView('home');
}

function makeFeat(code, geo, neName) {
  const polys = geo.geometry.type === 'Polygon' ? [geo.geometry.coordinates]
    : geo.geometry.type === 'MultiPolygon' ? geo.geometry.coordinates : [];
  let main = geo.geometry, fit = geo;
  if (polys.length) {
    const asPoly = p => ({ type: 'Polygon', coordinates: p });
    const mainP = polys.reduce((a, b) => d3.geoArea(asPoly(b)) > d3.geoArea(asPoly(a)) ? b : a);
    main = asPoly(mainP);
    // Fit the view to the "home" part of a country only (so France's overseas
    // departments don't drag a Western Europe view across the world).
    const mc = d3.geoCentroid(main);
    const near = polys.filter(p => d3.geoDistance(d3.geoCentroid(asPoly(p)), mc) < 25 * Math.PI / 180);
    fit = { type: 'Feature', geometry: { type: 'MultiPolygon', coordinates: near } };
  }
  if (code === '643') fit = { type: 'Feature', geometry: { type: 'MultiPoint', coordinates: [[20, 42], [60, 42], [60, 70], [20, 70]] } };
  return { code, geo, neName, main, fit };
}

function mapSize() { return [sv.clientWidth || 800, sv.clientHeight || 500]; }

function project(codes) {
  const [W, H] = mapSize(), pad = Math.min(28, W * .04);
  const ext = [[pad, pad], [W - pad, H - pad]];
  let proj;
  if (!codes.length) {
    proj = d3.geoNaturalEarth1().fitExtent(ext, { type: 'Sphere' });
  } else {
    // Try several central meridians and keep the one that lets us zoom in most
    // (handles the Pacific / antimeridian nicely).
    const fc = { type: 'FeatureCollection', features: codes.map(c => FEATS.get(c)?.fit).filter(Boolean) };
    let best = null;
    for (let lam = -180; lam < 180; lam += 15) {
      const p = d3.geoNaturalEarth1().rotate([lam, 0]).fitExtent(ext, fc);
      const score = p.scale() * (lam === 0 ? 1.08 : 1);
      if (!best || score > best.score) best = { p, score };
    }
    proj = best.p;
    // Don't zoom in absurdly far on a handful of tiny islands.
    const maxScale = Math.min(W, H) * 6;
    if (proj.scale() > maxScale) {
      const [cx, cy] = d3.geoPath(proj).centroid(fc);
      const s = maxScale / proj.scale(), t = proj.translate();
      proj.scale(maxScale).translate([W / 2 + (t[0] - cx) * s, H / 2 + (t[1] - cy) * s]);
    }
  }
  path = d3.geoPath(proj);
  for (const f of FEATS.values()) {
    if (f.el) f.el.setAttribute('d', path(f.geo) || '');
    const [[x0, y0], [x1, y1]] = path.bounds(f.main);
    f.s = Math.max(x1 - x0, y1 - y0) || 0;
    f.pt = path.centroid(f.main);
    if (!isFinite(f.pt[0])) f.pt = [(x0 + x1) / 2, (y0 + y1) / 2];
    if (f.mk) { f.mk.setAttribute('cx', f.pt[0]); f.mk.setAttribute('cy', f.pt[1]); }
    if (f.lb) { f.lb.setAttribute('x', f.pt[0]); f.lb.setAttribute('y', f.pt[1]); }
  }
  gFx.selectAll('*').remove();
  svg.call(zoom.transform, d3.zoomIdentity);
}

function fillOf(code) {
  const c = COUNTRY[code];
  if (view === 'home') {
    if (!inPlay(code)) return 'var(--land-off)';
    return store.selected.includes(c.region) ? regionColor(c.region, c.idx) : 'var(--land)';
  }
  if (!active.has(code)) return 'var(--land-off)';
  if (view === 'study') return regionColor(c.region, c.idx);
  const r = q && q.res[code];
  // Hard mode: answers don't stay colored during the quiz (only a just-missed target, briefly).
  if (r && (view === 'results' || !q.hard || (q.locked && code === q.target))) return RES_FILL[r];
  if (view === 'quiz' && q.mode === 'type' && code === q.target) return 'var(--accent)';
  return 'var(--land)';
}

function clickable(code) {
  if (view === 'home') return inPlay(code);
  if (view === 'quiz') return q.mode === 'find' && active.has(code);
  return active.has(code);
}

function paintAll() {
  for (const f of FEATS.values()) {
    const fill = fillOf(f.code), cl = clickable(f.code);
    if (f.el) { f.el.style.fill = fill; f.el.classList.toggle('click', cl); }
    if (f.mk) { f.mk.style.fill = fill; f.mk.classList.toggle('click', cl); }
  }
  rescale();
}

function labelWanted(f) {
  if (view === 'study') return store.labels && active.has(f.code);
  if (view === 'results') return active.has(f.code) && q.res[f.code] && q.res[f.code] !== 1;
  return false;
}

function rescale() {
  gL.attr('font-size', 11.5 / k).attr('stroke-width', 3 / k);
  for (const f of SOV) {
    const show = view === 'home' ? inPlay(f.code) : active.has(f.code);
    const mk = show && f.s * k < 7;
    f.mk.style.display = mk ? '' : 'none';
    if (mk) f.mk.setAttribute('r', 4.5 / k);
    const lb = labelWanted(f) && (f.s * k >= 18 || (mk && k >= 1.8) || view === 'results');
    f.lb.style.display = lb ? '' : 'none';
    if (lb) { f.lb.setAttribute('text-anchor', mk ? 'start' : 'middle'); f.lb.setAttribute('dx', mk ? '0.7em' : 0); }
  }
  gFx.selectAll('circle').attr('r', 12 / k);
}

function ring(code, cls = '', ms = 0) {
  const f = FEATS.get(code);
  const c = gFx.append('circle').attr('class', 'ring ' + cls).attr('cx', f.pt[0]).attr('cy', f.pt[1]).attr('r', 12 / k);
  if (ms) setTimeout(() => c.remove(), ms);
  return c;
}

function flash(code, kind = 'bad') {
  const f = FEATS.get(code), cls = kind === 'good' ? 'flash-good' : 'flash';
  for (const el of [f.el, f.mk]) {
    if (!el) continue;
    el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 800);
  }
}

function zoomTo(code, ms = 650) {
  const f = FEATS.get(code);
  const [[x0, y0], [x1, y1]] = path.bounds(f.fit);
  const [W, H] = mapSize();
  const kk = Math.max(1, Math.min(12, 0.4 * Math.min(W / Math.max(x1 - x0, 1), H / Math.max(y1 - y0, 1))));
  const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(kk).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  if (ms) svg.transition().duration(ms).call(zoom.transform, t);
  else svg.call(zoom.transform, t);
}

// In type mode the highlighted country is the question, so centre it in the map. On iOS
// the keyboard changes the visual viewport after focus; pass ms = 0 when the map has just

function centerQuizTarget(ms = 450) {

function tipHtml(code) {

const codeAt = el => el && el.closest && el.closest('[data-code]')?.dataset.code;

sv.addEventListener('pointermove', e => {

  const code = codeAt(e.target);
  if (code !== hovCode) {
    if (hovCode) setHover(hovCode, false);
    hovCode = code && clickable(code) ? code : null;
    if (hovCode) setHover(hovCode, true);
  }
  const h = code && tipHtml(code);
  h ? showTip(h, e.clientX, e.clientY) : hideTip();
});
sv.addEventListener('pointerleave', () => { if (hovCode) setHover(hovCode, false); hovCode = null; hideTip(); });
let tipTimer, tap = null, lastTap = 0;
function onMapTap(code, x, y, touch) {
  if (view === 'home') {
    if (inPlay(code)) toggleRegion(COUNTRY[code].region);
  } else if (view === 'quiz') {
    if (q.mode === 'find') onFindClick(code);
  }
  const h = tipHtml(code);
  clearTimeout(tipTimer);
  if (h && (touch || view === 'home')) { showTip(h, x, y); if (touch) tipTimer = setTimeout(hideTip, 1800); }
}
// The closest visible small-country dot within r screen px (fingers are bigger than the dots).
function nearestMarker(x, y, r) {
  let best = null, bd = r;
  for (const f of SOV) {
    if (f.mk.style.display === 'none' || !clickable(f.code)) continue;
    const b = f.mk.getBoundingClientRect();
    const d = Math.hypot(b.x + b.width / 2 - x, b.y + b.height / 2 - y);
    if (d < bd) { bd = d; best = f.code; }
  }
  return best;
}
// Touch taps are detected from pointer events rather than 'click': the zoom behavior
// cancels the click whenever a finger drifts even a pixel, so taps often didn't register.
sv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  // A second finger means a pinch, not a tap.
  tap = e.isPrimary ? { x: e.clientX, y: e.clientY, t: e.timeStamp, id: e.pointerId, el: e.target } : null;
});
sv.addEventListener('pointercancel', () => { tap = null; });
sv.addEventListener('pointerup', e => {
  if (e.pointerType === 'mouse' || !tap || e.pointerId !== tap.id) return;
  const s = tap; tap = null;
  if (Math.hypot(e.clientX - s.x, e.clientY - s.y) > 12 || e.timeStamp - s.t > 700) return;
  lastTap = Date.now();
  const hit = codeAt(s.el);
  // Right on top of a dot wins over the country underneath; in open sea, snap to a nearby dot.
  const code = nearestMarker(s.x, s.y, hit ? 7 : 22) || hit;
  if (code) onMapTap(code, s.x, s.y, true);
});
sv.addEventListener('click', e => {
  if (Date.now() - lastTap < 800) return; // already handled as a touch tap
  const code = codeAt(e.target);
  if (code) onMapTap(code, e.clientX, e.clientY, false);
});

let resizeT;
new ResizeObserver(() => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!path) return;
    project(view === 'home' ? [] : pool);
    if (view === 'quiz' && q.mode === 'type' && q.target) {
      q.ringEl = ring(q.target);
      centerQuizTarget(0);
    }
    paintAll();
  }, 120);
}).observe(sv);

function setView(v) {
  const prev = view;
  view = v;
  document.body.classList.toggle('quizzing', v === 'quiz');
  document.body.dataset.view = v;
  window.scrollTo(0, 0);
  active = v === 'home' ? new Set() : new Set(pool);
  const key = v === 'home' ? 'home' : pool.join(',');
  if (key !== projKey) { project(v === 'home' ? [] : pool); projKey = key; }
  // The projection is shared by study/quiz/results, but a type quiz zooms to its target.
  // Leaving the quiz must restore the pool view, so reset the zoom on any view change.
  if (v !== prev) svg.call(zoom.transform, d3.zoomIdentity);
  if (hovCode) setHover(hovCode, false); hovCode = null; hideTip();
  paintAll();
  render();
}

function render() {
  if (LIST_MODULES[app]) { activeList = app; return renderList(LIST_MODULES[app]); }
  const scroll = $('.pscroll', panel)?.scrollTop || 0;
  panel.innerHTML = navHeadHtml() + (view === 'home' ? homeHtml() : view === 'study' ? studyHtml() : view === 'quiz' ? quizHtml() : resultsHtml());
  if (view === 'home') {
    panel.querySelectorAll('[data-ind]').forEach(el => el.indeterminate = true);
    $('.pscroll', panel).scrollTop = scroll;
  }
  if (view === 'quiz') updateQuizUI();
}

function selectionPool() {
  const sel = new Set(store.selected);
  return CONTINENTS.flatMap(c => c.regions).filter(r => sel.has(r.id)).flatMap(regionCodes).filter(c => FEATS.has(c));
}
function poolInfo(codes) {
  const regs = [...new Set(codes.map(c => COUNTRY[c].region))];
  const set = new Set(codes);
  // "Full" = every region is complete, either countries only or countries + all its territories.
  const parts = regs.map(rid => {
    const r = REGIONS[rid], t = r.terr.filter(c => set.has(c)).length;
    const ok = r.codes.every(c => set.has(c)) && (t === 0 || t === r.terr.length);
    return ok ? rid + (t ? '+t' : '') : null;
  });
  const full = parts.every(Boolean);
  const withTerr = codes.some(c => COUNTRY[c].terr);
  const title = !full ? `${codes.length} places`
    : (regs.length <= 3 ? regs.map(r => REGIONS[r].name).join(' + ') : `${regs.length} regions · ${codes.length} places`) + (withTerr ? ' (with territories)' : '');
  return { regs, full, title, key: full ? parts.sort().join(',') : null };
}
const weakOf = codes => codes.filter(c => store.stats[c] && store.stats[c].last !== 1);

function hardToggle() {

}
const TERR_REGIONS = Object.keys(REGIONS).filter(id => REGIONS[id].terr.length);
const allTerrOn = () => TERR_REGIONS.every(terrOn);

function toggleRegion(id) {
  const s = new Set(store.selected);
  s.has(id) ? s.delete(id) : s.add(id);
  store.selected = [...s]; save(); paintAll(); render();
}

const ACTIONS = {
  home: () => setView('home'),
  selLearned: () => { store.selected = store.learned.slice(); save(); paintAll(); render(); },
  selAll: () => { store.selected = Object.keys(REGIONS); save(); paintAll(); render(); },
  selNone: () => { store.selected = []; save(); paintAll(); render(); },
  learn: b => {
    const s = new Set(store.learned), id = b.dataset.id;
    s.has(id) ? s.delete(id) : s.add(id);
    store.learned = [...s]; save(); render();
  },
  terr: b => {
    const s = new Set(store.terrRegions), id = b.dataset.id;
    s.has(id) ? s.delete(id) : s.add(id);
    store.terrRegions = [...s]; save(); paintAll(); render();
  },
  terrAll: () => { store.terrRegions = allTerrOn() ? [] : TERR_REGIONS.slice(); save(); paintAll(); render(); },
  study: () => { pool = selectionPool(); setView('study'); },
  quizFind: () => startQuiz('find', view === 'study' ? pool : selectionPool()),
  quizType: () => startQuiz('type', view === 'study' ? pool : selectionPool()),
  quizWeak: () => startQuiz('find', weakOf(selectionPool())),
  locate: b => { const c = b.dataset.code; zoomTo(c); ring(c, '', 2400); },
  quit: () => { stopTimer(); q = null; setView('home'); },
  reveal: () => failTarget(),
  retryMissed: () => startQuiz(q.mode, q.queue.filter(c => q.res[c] !== 1)),
  again: () => startQuiz(q.mode, q.queue),
  otherMode: () => startQuiz(q.mode === 'find' ? 'type' : 'find', q.queue),
  studyMissed: () => { pool = q.queue.filter(c => q.res[c] !== 1); setView('study'); },
  markLearned: () => { store.learned = [...new Set([...store.learned, ...poolInfo(q.queue).regs])]; save(); render(); },
};
panel.addEventListener('click', e => {

// ---------------------------------------------------------------------------
// Quiz
// ---------------------------------------------------------------------------
let timer;
function stopTimer() { clearInterval(timer); }

function startQuiz(mode, codes) {
  if (!codes.length) return;
  stopTimer();
  pool = codes.slice();
  const info = poolInfo(pool);
  const hard = store.hard;
  q = { mode, hard, queue: shuffle(pool), i: -1, tries: 0, res: {}, start: Date.now(), bestKey: info.key ? `${mode}${hard ? '!' : ''}:${info.key}` : null };
  // Start every run from a fresh pool view; type mode then centres the first target.
  projKey = null;
  setView('quiz');
  timer = setInterval(() => { const el = $('#qtime'); if (el) el.textContent = fmtTime(Date.now() - q.start); }, 500);
  next();
}

function next() {
  q.ringEl?.remove(); q.ringEl = null;
  q.tries = 0; q.locked = false;
  q.i++;
  if (q.i >= q.queue.length) return finish();
  q.target = q.queue[q.i];
  paintAll();
  if (q.mode === 'type') {
    q.ringEl = ring(q.target);
    const inp = $('#qin'); inp.value = ''; inp.focus();
    // Before the keyboard opens there is no visible map to centre in; snap once it has.
    centerQuizTarget(keyboardOpen() ? 450 : 0);
  }
  updateQuizUI();
}

function setRes(code, r) {
  q.res[code] = r;
  const st = store.stats[code] || (store.stats[code] = { n: 0, ok: 0 });
  st.n++; if (r === 1) st.ok++; st.last = r;
  save();
}

function onFindClick(code) {
  if (q.locked || !active.has(code)) return;
  // In hard mode answered countries look unanswered, so clicking one is just a wrong guess.
  if (q.res[code] && !q.hard) { fb(`That's ${esc(nameOf(code))}`, 'info'); return; }
  if (code === q.target) {
    setRes(code, q.tries + 1);
    fb(`✓ ${esc(nameOf(code))}`, 'good');
    if (q.hard) flash(code, 'good');
    next();
  } else {
    q.tries++;
    flash(code);
    fb(`✗ That's ${esc(nameOf(code))}`, 'bad');
    if (q.tries >= 3) failTarget();
  }
}

function submitGuess() {
  if (q.locked) return;
  const inp = $('#qin'), guess = norm(inp.value);
  if (!guess) return;
  if (isMatch(guess, q.target)) {
    setRes(q.target, q.tries + 1);
    fb(`✓ ${esc(nameOf(q.target))}`, 'good');
    next();
    return;
  }
  q.tries++;
  inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
  inp.select();
  if (q.tries >= 3) return failTarget();
  const nm = nameOf(q.target);
  fb(q.tries === 2 ? `✗ Hint: starts with “${esc(nm[0])}”, ${nm.replace(/[^A-Za-zÀ-ÿ]/g, '').length} letters` : '✗ Not quite — try again', 'bad');
}

function failTarget() {
  if (q.locked || !q.target) return;
  q.locked = true;
  setRes(q.target, 'x');
  q.ringEl?.remove();
  q.ringEl = ring(q.target, 'bad');
  fb(`It was <b>${esc(nameOf(q.target))}</b>`, 'bad');
  paintAll(); updateQuizUI();
  setTimeout(() => { if (view === 'quiz') next(); }, q.mode === 'type' ? 1800 : 1500);
}

function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[b.length];
}
function isMatch(guess, code) {
  const forms = COUNTRY[code].forms;
  if (forms.includes(guess)) return true;
  // An exact match for a different country is wrong (Niger ≠ Nigeria).
  if (Object.values(COUNTRY).some(c => c.code !== code && c.forms.includes(guess))) return false;
  return forms.some(f => lev(guess, f) <= (f.length >= 9 ? 2 : f.length >= 5 ? 1 : 0));
}

function finish() {
  stopTimer();
  q.elapsed = Date.now() - q.start;
  q.target = null;
  const first = q.queue.filter(c => q.res[c] === 1).length;
  const pct = Math.round(100 * first / q.queue.length);
  if (q.bestKey) {
    const b = store.best[q.bestKey];
    if (!b || pct > b.pct || (pct === b.pct && q.elapsed < b.ms)) { store.best[q.bestKey] = { pct, ms: q.elapsed }; q.newBest = !!b; }
    save();
  }
  gFx.selectAll('*').remove();
  setView('results');
}

// ---------------------------------------------------------------------------
// App switcher (World / Presidents)
// ---------------------------------------------------------------------------
const APP_LABEL = { countries: 'World', presidents: 'Presidents', shakespeare: 'Shakespeare' };

  return `<div class="phead"><button class="navbtn" data-nav-toggle aria-label="Open menu" aria-expanded="${open}"><svg class="navicon" viewBox="0 0 16 12" aria-hidden="true" focusable="false"><rect x="0" y="0" width="16" height="2" rx="1"/><rect x="0" y="5" width="16" height="2" rx="1"/><rect x="0" y="10" width="16" height="2" rx="1"/></svg></button><span class="app">${APP_LABEL[app]}</span></div>`;
}

function setNav(open) {
  document.body.classList.toggle('nav-open', open);
  for (const b of document.querySelectorAll('[data-nav-toggle]')) b.setAttribute('aria-expanded', String(open));
  const target = open ? $('#navClose') : $('[data-nav-toggle]');
  target?.focus({ preventScroll: true });
}

$('#navScrim').addEventListener('click', () => setNav(false));
$('#navClose').addEventListener('click', () => setNav(false));
panel.addEventListener('click', e => { if (e.target.closest('[data-nav-toggle]')) setNav(true); });

// Deep links: #world, #presidents and #shakespeare survive a refresh and can be shared.
const APP_SLUG = { countries: 'world', presidents: 'presidents', shakespeare: 'shakespeare' };
const appFromHash = () => {
  const h = location.hash.replace(/^#\/?/, '');
  return Object.keys(APP_SLUG).find(k => APP_SLUG[k] === h) || 'countries';
};
function syncHash(a) {
  const h = '#' + APP_SLUG[a];
  if (location.hash !== h) history.replaceState(null, '', h);
}

function setApp(a) {
  if (!a || a === app) { syncHash(app); return; }
  app = a;
  document.body.dataset.app = a;
  document.body.dataset.module = LIST_MODULES[a] ? 'list' : 'map';
  syncHash(a);
  // A quiz keeps running in the background while another topic is on screen.
  document.body.classList.toggle('quizzing', a === 'countries' && view === 'quiz');
  for (const b of document.querySelectorAll('#nav [data-app]')) b.classList.toggle('on', b.dataset.app === a);
  hideTip();
  if (LIST_MODULES[a]) {
    activeList = a;
    renderList(LIST_MODULES[a]);
  } else {
    activeList = null;
    render();
    // The map had zero size while hidden, so re-project once it is visible again.
    requestAnimationFrame(() => {
      if (!path) return;
      project(view === 'home' ? [] : pool);
      if (view === 'quiz' && q && q.mode === 'type' && q.target) {
        q.ringEl = ring(q.target);
        centerQuizTarget(0);
      }
      paintAll();
    });
  }
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-app]');
  if (!b) return;
  setApp(b.dataset.app);
  setNav(false);
});
window.addEventListener('hashchange', () => setApp(appFromHash()));

const listState = {};

const listSt = cfg => listState[cfg.id];
const fuzzyLimit = f => f.length >= 9 ? 2 : f.length >= 5 ? 1 : 0;

function listLegendHtml(cfg) {
  return `<h3>${esc(cfg.legendTitle)}</h3><ul class="llegend">${cfg.legend.map(g =>
    `<li><span class="ldot ${g.cls}"></span>${esc(g.name)}</li>`).join('')}</ul>`;
}

function listRow(cfg, item, i) {
  const st = listSt(cfg), qz = st.qz;
  const quiz = st.view === 'quiz' && qz;
  if (!quiz) {
    return `<li class="lrow done" title="${esc(item.tip)}"><span class="ln">${item.n}</span>
      <span class="ldot ${item.cls}"></span><span class="lname">${esc(item.name)}</span><span class="lmeta">${esc(item.meta)}</span></li>`;
  }
  const done = cfg.ordered ? i < qz.i : qz.found.has(i);
  const cur = cfg.ordered && i === qz.i;
  if (!done) {
    return `<li class="lrow todo${cur ? ' cur' : ''}"><span class="ln">${item.n}</span><span class="lline"></span></li>`;
  }
  const miss = qz.revealed.has(i);
  return `<li class="lrow done${cur ? ' cur' : ''}${miss ? ' miss' : ''}" title="${esc(item.tip)}">
    <span class="ln">${item.n}</span><span class="ldot ${item.cls}"></span>
    <span class="lname">${esc(item.name)}</span><span class="lmeta">${esc(item.meta)}</span></li>`;
}
const listRowsHtml = cfg => cfg.items.map((it, i) => listRow(cfg, it, i)).join('');

function renderList(cfg) {
  const st = listSt(cfg);
  document.body.dataset.lview = st.view;
  const head = navHeadHtml();
  if (st.view === 'quiz') {
    panel.innerHTML = head + listQuizHtml(cfg);
    listmain.innerHTML = listQuizMainHtml(cfg);
  } else if (st.view === 'home') {
    panel.innerHTML = head + listHomeHtml(cfg);
    listmain.innerHTML = listHomeMainHtml(cfg);
  } else {
    panel.innerHTML = head + listResultsHtml(cfg);
    listmain.innerHTML = listResultsMainHtml(cfg);
  }
  window.scrollTo(0, 0);
  listmain.scrollTop = 0;
  if (st.view === 'quiz') { updateListUI(cfg); $('#lin')?.focus(); }
}

function updateListUI(cfg) {
  const st = listSt(cfg), qz = st.qz;
  if (!qz) return;
  const total = cfg.items.length;
  const found = cfg.ordered ? Math.min(qz.i, total) : qz.found.size;
  const set = (id, txt) => { const el = $('#' + id); if (el) el.textContent = txt; };
  set('lprog', `${cfg.ordered ? Math.min(found + 1, total) : found} / ${total}`);
  const bar = $('#lbar'); if (bar) bar.style.width = (100 * found / total) + '%';
  const prompt = $('#lprompt');
  if (prompt) prompt.innerHTML = cfg.promptHtml(cfg, st);
  const tally = $('#ltally');
  if (tally) tally.innerHTML = `<span title="Revealed"><i class="dot rx"></i>${qz.revealed.size}</span><span title="Wrong guesses"><i class="dot r3"></i>${qz.wrong}</span>`;
  const list = $('#llist');
  if (list) {
    list.innerHTML = listRowsHtml(cfg);
    // The list may be its own scroller (narrow screens) or sit inside #listmain (wide ones).
    const scroller = list.closest('#listmain') || list;
    if (scroller.scrollHeight > scroller.clientHeight + 1) {
      const sr = scroller.getBoundingClientRect(), cur = list.querySelector('.cur');
      if (cur) {
        const cr = cur.getBoundingClientRect();
        // Leave a little air so the highlighted row isn't flush with the edges.
        if (cr.top < sr.top + 10) scroller.scrollTop += cr.top - sr.top - 10;
        else if (cr.bottom > sr.bottom - 10) scroller.scrollTop += cr.bottom - sr.bottom + 10;
      }
    }
  }
}

function listMatchOrdered(cfg, guess, idx) {
  const item = cfg.items[idx];
  if (item.forms.includes(guess)) return { idx };
  // An exact name of some other item is wrong, no fuzzy credit (Adams ≠ Adams' typo).
  if (cfg.items.some((x, j) => j !== idx && x.forms.includes(guess))) return { wrong: true };
  if (item.forms.some(f => lev(guess, f) <= fuzzyLimit(f))) return { idx };
  return { wrong: true };
}

function listMatchUnordered(cfg, guess, found) {
  const exact = [];
  cfg.items.forEach((it, i) => { if (it.forms.includes(guess)) exact.push(i); });
  if (exact.length) {
    const i = exact.find(i => !found.has(i));
    return i === undefined ? { already: exact[0] } : { idx: i };
  }
  // Fuzzy only for typos, and only when one item is clearly the closest.
  let best = null;
  cfg.items.forEach((it, i) => {
    for (const f of it.forms) {
      const d = lev(guess, f);
      if (d > fuzzyLimit(f)) continue;
      if (!best || d < best.d) best = { idx: i, d, amb: false };
      else if (d === best.d && i !== best.idx) best.amb = true;
    }
  });
  if (!best) return { wrong: true };
  if (best.amb) return { ambiguous: true };
  return found.has(best.idx) ? { already: best.idx } : { idx: best.idx };
}

function startList(cfg) {
  const st = listSt(cfg);
  clearInterval(st.timer);
  st.qz = { i: 0, wrong: 0, revealed: new Set(), found: new Set(), t0: Date.now(), elapsed: 0, done: false, newBest: false };
  st.view = 'quiz';
  renderList(cfg);
  st.timer = setInterval(() => {
    if (activeList !== cfg.id) return;
    const el = $('#ltime'); if (el) el.textContent = fmtTime(Date.now() - st.qz.t0);
  }, 500);
  $('#lin')?.focus();
}

function submitList(cfg) {
  const st = listSt(cfg), qz = st.qz;
  if (!qz || qz.done) return;
  const inp = $('#lin'); if (!inp) return;
  const guess = norm(inp.value);
  if (!guess) return;

  if (cfg.ordered) {
    const r = listMatchOrdered(cfg, guess, qz.i);
    if (r.idx !== undefined) {
      const item = cfg.items[r.idx];
      inp.value = '';
      qz.i++;
      listFb(`✓ ${esc(item.name)}`, 'good');
      if (qz.i >= cfg.items.length) return finishList(cfg);
      updateListUI(cfg);
      inp.focus();
    } else {
      qz.wrong++;
      shakeEl(inp);
      inp.select();
      listFb(qz.wrong > 1 ? `✗ Still not #${cfg.items[qz.i].n}` : `✗ Not #${cfg.items[qz.i].n} — try again`, 'bad');
      updateListUI(cfg);
    }
    return;
  }

  const r = listMatchUnordered(cfg, guess, qz.found);
  if (r.idx !== undefined) {
    qz.found.add(r.idx);
    inp.value = '';
    listFb(`✓ ${esc(cfg.items[r.idx].name)}`, 'good');
    if (qz.found.size >= cfg.items.length) return finishList(cfg);
    updateListUI(cfg);
    inp.focus();
  } else if (r.already !== undefined) {
    listFb(`Already got <b>${esc(cfg.items[r.already].name)}</b>`, 'info');
    inp.select();
  } else if (r.ambiguous) {
    listFb('More than one play fits — be more specific.', 'info');
    inp.select();
  } else {
    qz.wrong++;
    shakeEl(inp);
    inp.select();
    listFb(qz.wrong > 1 ? '✗ Still not one of them' : '✗ Not one of them — try again', 'bad');
    updateListUI(cfg);
  }
}

function revealList(cfg) {
  const st = listSt(cfg), qz = st.qz;
  if (!qz || qz.done) return;
  let idx;
  if (cfg.ordered) idx = qz.i;
  else {
    const left = cfg.items.map((_, i) => i).filter(i => !qz.found.has(i));
    if (!left.length) return finishList(cfg);
    idx = left[Math.floor(Math.random() * left.length)];
  }
  const item = cfg.items[idx];
  qz.revealed.add(idx);
  if (cfg.ordered) qz.i++;
  else qz.found.add(idx);
  listFb(cfg.ordered ? `#${item.n} was <b>${esc(item.name)}</b>` : `<b>${esc(item.name)}</b>`, 'bad');
  if ((cfg.ordered ? qz.i : qz.found.size) >= cfg.items.length) return finishList(cfg);
  updateListUI(cfg);
  $('#lin')?.focus();
}

function finishList(cfg) {
  const st = listSt(cfg), qz = st.qz;
  clearInterval(st.timer);
  qz.elapsed = Date.now() - qz.t0;
  qz.done = true;
  const prev = store[cfg.bestKey];
  const better = !prev || qz.revealed.size < prev.miss ||
    (qz.revealed.size === prev.miss && qz.elapsed < prev.ms);
  if (better) { store[cfg.bestKey] = { miss: qz.revealed.size, ms: qz.elapsed }; qz.newBest = !!prev; save(); }
  st.view = 'results';
  renderList(cfg);
}

function quitList(cfg) {
  const st = listSt(cfg);
  clearInterval(st.timer);
  st.qz = null;
  st.view = 'home';
  renderList(cfg);
}

const PACTIONS = {
  start: () => startList(LIST_MODULES[activeList]),
  reveal: () => revealList(LIST_MODULES[activeList]),
  quit: () => quitList(LIST_MODULES[activeList]),
  list: () => { const cfg = LIST_MODULES[activeList], st = listSt(cfg); st.qz = null; st.view = 'home'; renderList(cfg); },
};
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-pact]');
  if (b && !b.disabled) PACTIONS[b.dataset.pact](b, e);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.body.classList.contains('nav-open')) { setNav(false); return; }
  if (app === 'countries' && view === 'quiz') failTarget();
});

// iOS Safari does not resize the layout viewport when the keyboard opens: only the visual
// viewport shrinks, and Safari pans the page to reveal the focused input. Sizing the
// presidents quiz shell to the visual viewport keeps the input anchored above the keyboard
// and leaves the list as the only thing that scrolls.
const keepQuizAnchored = () => {
  const d = document.body.dataset;
  const quizzing = (d.module === 'list' && d.lview === 'quiz') ||
    (d.app === 'countries' && d.view === 'quiz');
  if (quizzing && window.scrollY) window.scrollTo(0, 0);
};
if (window.visualViewport) {
  const vv = window.visualViewport;
  const syncAppVh = () => {
    document.documentElement.style.setProperty('--app-vh', vv.height + 'px');
    keepQuizAnchored();
  };
  vv.addEventListener('resize', syncAppVh);
  vv.addEventListener('scroll', syncAppVh);
  syncAppVh();
}
// Safari also scrolls the document itself to reveal the focused input; undo that so the
// header stays at the top of the shell.
window.addEventListener('scroll', keepQuizAnchored, { passive: true });

init();
// Restore the topic from the URL (and canonicalise a bare URL to #world).
setApp(appFromHash());

// Offline support. The first visit installs the worker; a later release waits until the
// banner is used or every tab is closed, so an update never interrupts a quiz.
if ('serviceWorker' in navigator) {
  let reloadRequested = false;
  const showUpdate = () => { const b = $('#updateBanner'); if (b) b.hidden = false; };

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadRequested) location.reload();
  });

  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      // Ask for durable storage so the browser is less likely to evict saved progress.
      if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        worker?.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
        });
      });
      $('#updateReload')?.addEventListener('click', () => {
        reloadRequested = true;
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        else location.reload();
      });
    } catch (e) {
      // Offline support is a progressive enhancement; the app still works online.
    }
  });
}
</script>
