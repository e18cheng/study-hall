<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Hall">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="A study hall for trivia: memorize world geography, US presidents, and more. Works offline once installed.">
<title>Study Hall</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body data-app="countries" data-module="map">
<div id="updateBanner" hidden>
  <span>A new version is available.</span>
  <button type="button" id="updateReload">Reload</button>
</div>
<div id="navScrim"></div>
<nav id="nav" aria-label="Study topics">
  <div class="navhead"><span>Study Hall</span><button id="navClose" aria-label="Close menu">✕</button></div>
  <button data-app="home" aria-label="Study Hall home">
    <span aria-hidden="true">🏠</span><span class="lbl">Home</span>
  </button>
  <button data-app="countries" aria-label="World Geography">
    <span aria-hidden="true">🌍</span><span class="lbl">World</span>
  </button>
  <button data-app="presidents" aria-label="US Presidents">
    <span aria-hidden="true">🏛️</span><span class="lbl">Presidents</span>
  </button>
  <button data-app="shakespeare" aria-label="Shakespeare">
    <span aria-hidden="true">🎭</span><span class="lbl">Shakespeare</span>
  </button>
  <button data-app="elements" aria-label="Periodic Table">
    <span aria-hidden="true">⚛️</span><span class="lbl">Elements</span>
  </button>
  <button data-app="wars" aria-label="US Wars">
    <span aria-hidden="true">⚔️</span><span class="lbl">Wars</span>
  </button>
</nav>
<aside id="panel"></aside>
<main id="listmain"></main>
<div id="mapwrap" role="main">
  <svg id="map"></svg>
  <div id="tip"></div>
  <div class="zoomctl">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zreset" title="Reset view">⟲</button>
  </div>
  <div id="loading">Loading map…</div>
</div>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script src="map-data.js"></script>
<script src="countries-data.js"></script>
<script src="presidents-data.js"></script>
<script src="shakespeare-data.js"></script>
<script src="elements-data.js"></script>
<script src="wars-data.js"></script>
<script src="core.js"></script>
<script src="map.js"></script>
<script src="list.js"></script>
<script src="presidents.js"></script>
<script src="shakespeare.js"></script>
<script src="elements.js"></script>
<script src="wars.js"></script>
<script src="app.js"></script>
</body>
</html>
